[project]
name = "go-test-agent"
version = "0.1.0"
description = "Go test coverage improvement agent with MCP server support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.18",
    "mcp>=0.9.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
go-test-mcp-server = "mcp_server:main"
